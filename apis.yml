name: Transcend Medical
description: Transcend Medical was a medical device company based in Menlo Park, California,
  developing minimally invasive glaucoma surgery (MIGS) devices. Spun out of the ForSight Labs
  ophthalmic incubator, its lead product was the CyPass Micro-Stent, a suprachoroidal implant
  designed to lower intraocular pressure in patients with mild-to-moderate glaucoma undergoing
  cataract surgery. The company raised roughly $89.8M across multiple venture rounds from
  investors including Canaan Partners, HLM Venture Partners, Finistere Ventures, Kaiser Permanente
  Ventures, Latterell Venture Partners, Morgenthaler Ventures, Split Rock Partners and Technology
  Partners, and was acquired by Novartis's Alcon eye-care business in February 2016. It operated
  no public API, developer platform, or software product; the transcendmedical.com domain no longer
  resolves following the company's absorption into Alcon.
